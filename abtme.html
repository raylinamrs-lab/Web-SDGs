<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Ray</title>
    <link rel="stylesheet" href="abtme.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="profile-section">
            <div class="profile-frame">
                <img src="ray.jpeg" alt="Foto Ray" class="profile-pic" id="profilePic">
            </div>
            <h1 class="nickname">Hi, I'm <span class="highlight">Ray</span>! 🌸</h1>
            <p class="subtitle">Welcome to my little corner</p>
        </div>

        <div class="info-grid">
            <div class="info-item">
                <span class="label">Nama Lengkap</span>
                <span class="value">Raylina Margaret Rachel Sitanggang</span>
            </div>
            
            <div class="info-row">
                <div class="info-item">
                    <span class="label">Nama Panggilan</span>
                    <span class="value">Ray</span>
                </div>
                <div class="info-item">
                    <span class="label">Kelas / No. Absen</span>
                    <span class="value">92 / 33</span>
                </div>
            </div>

            <div class="info-item funfact-box">
                <span class="label">Funfact ✨</span>
                <span class="value">I'm a marvel enthusiast :) <strong>(IM SO EXCITED 4 DOOMSDAY)</strong></span>
            </div>
        </div>

        <div class="action-section">
            <button id="hypeBtn" class="pastel-btn">Click for Doomsday Hype! 💜</button>
            <p id="hypeText" class="hype-message"></p>
        </div>

        <div class="footer-note">
            <p>p.s: add me on letterboxd 🎬 
                <a href="https://letterboxd.com/lasagnawcheese/" target="_blank">@lasagnawcheese</a>
            </p>
            <button id="copyBtn" class="copy-btn">Copy Username</button>
        </div>
    </div>

    <script src="abtme.js"></script>
</body>
</html>
